---
- name: Diagnose SSM connection
  hosts: controller
  gather_facts: true

  tasks:

    - name: Show connection
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Connection: {{ ansible_connection }}"
          - "User: {{ ansible_user | default('not defined') }}"
          - "Remote tmp: {{ ansible_remote_tmp | default('not defined') }}"

    - name: Who am I
      ansible.builtin.command:
        cmd: whoami
      register: whoami_result
      changed_when: false

    - name: Show user
      ansible.builtin.debug:
        var: whoami_result.stdout

    - name: Show home
      ansible.builtin.command:
        cmd: sh -c 'echo $HOME'
      register: home_result
      changed_when: false

    - name: Show home directory
      ansible.builtin.debug:
        var: home_result.stdout
