---
# Staging Environment Group Variables
# Applied to all hosts in env_stg group (created by keyed_groups on Environment=stg tag)
# Precedence: group_vars/all.yml < group_vars/env_stg.yml < host_vars/
#
# Usage: ansible-playbook site.yml --limit env_stg

environment_name: staging
environment_short: stg

# Staging in secondary region for disaster recovery testing
ansible_aws_ssm_region: us-west-2

# Production-grade timeouts
ansible_connection_timeout: 60
ansible_timeout: 300

# Elevated privileges required
ansible_become: true
ansible_become_method: sudo

# Staging logging similar to production
log_level: WARN
enable_performance_logging: false

# Enforce SSM-only access (no SSH)
fallback_ssh_enabled: false

# Full monitoring and observability
instance_monitoring: true
enable_detailed_cloudwatch: true

# Strict security compliance
security_scanning_enabled: true
compliance_checking: true
allow_security_exemptions: false

# Staging can test new deployment patterns
allow_rolling_deployments: true
canary_deployment_enabled: true
