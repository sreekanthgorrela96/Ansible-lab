---
# UAT Environment Group Variables
# Applied to all hosts in env_uat group (created by keyed_groups on Environment=uat tag)
# Precedence: group_vars/all.yml < group_vars/env_uat.yml < host_vars/
#
# Usage: ansible-playbook site.yml --limit env_uat

environment_name: user_acceptance_testing
environment_short: uat

# UAT-specific AWS SSM settings - may be in different region
ansible_aws_ssm_region: us-east-1

# UAT should be production-like
ansible_connection_timeout: 60
ansible_timeout: 300

# UAT with elevated privileges (similar to prod)
ansible_become: true
ansible_become_method: sudo

# Production-like logging
log_level: WARN
enable_performance_logging: false

# Enforce SSM-only access (production-like)
fallback_ssh_enabled: false

# Production-like monitoring
instance_monitoring: true
enable_detailed_cloudwatch: true

# Strict security checks like production
security_scanning_enabled: true
compliance_checking: true
allow_security_exemptions: false
