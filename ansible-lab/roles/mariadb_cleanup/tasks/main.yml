---
# tasks file for roles/mariadb_cleanup
- name: Remove database user
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    host: localhost
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Remove application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Remove database backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: absent

- name: Stop MariaDB
  ansible.builtin.service:
    name: "{{ mariadb_service }}"
    state: stopped

- name: Disable MariaDB
  ansible.builtin.service:
    name: "{{ mariadb_service }}"
    enabled: false

- name: Uninstall MariaDB packages
  ansible.builtin.apt:
    name: "{{ mariadb_packages }}"
    state: absent
    purge: true
    autoremove: true
