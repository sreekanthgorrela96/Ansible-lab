---
- name: Dispatch OS family specific SSH service facts
  ansible.builtin.include_tasks: "{{ ansible_os_family | lower }}.yml"
  tags:
    - ssh_hardening

- name: Deploy organizational security login banner
  ansible.builtin.template:
    src: issue.net.j2
    dest: "{{ ssh_banner_path }}"
    owner: root
    group: root
    mode: '0644'
  tags:
    - ssh_hardening

- name: Deploy organizational MOTD greeting
  ansible.builtin.template:
    src: motd.j2
    dest: "{{ ssh_motd_path }}"
    owner: root
    group: root
    mode: '0644'
  tags:
    - ssh_hardening

- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart sshd
  tags:
    - ssh_hardening
