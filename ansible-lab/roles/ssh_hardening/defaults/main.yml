---
ssh_hardening_enabled: true
ssh_port: 22
ssh_permit_root_login: "prohibit-password" # 'no', 'prohibit-password'
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_x11_forwarding: "no"
ssh_max_auth_tries: 3
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2
ssh_use_dns: "no"
ssh_banner_path: "/etc/issue.net"
ssh_motd_path: "/etc/motd"

# Organization Banner Customization
ssh_organization_name: "Barrett Business Services Incorporated"
ssh_organization_department: "Global Infrastructure & Information Security"
ssh_security_contact_email: "Security@bbsi.com"
ssh_system_classification: "CONFIDENTIAL / INTERNAL RESTRICTED"
ssh_banner_custom_text: "" # If specified, overrides default template rendering

# Modern Secure SSH Algorithms
ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr

ssh_kex_algorithms:
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  - diffie-hellman-group-exchange-sha256

ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256
