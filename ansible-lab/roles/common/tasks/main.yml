---
- name: Validate operating system family support
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: "Unsupported OS family: {{ ansible_os_family }}. This framework supports Debian and RedHat families."
    success_msg: "Supported OS family detected: {{ ansible_os_family }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"
  tags:
    - common
    - Always

- name: Create baseline logging directory
  ansible.builtin.file:
    path: "{{ common_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - common
    - Always

- name: Create baseline backup directory
  ansible.builtin.file:
    path: "{{ common_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags:
    - common
    - Always

- name: Capture maintenance start timestamp
  ansible.builtin.set_fact:
    maintenance_start_time: "{{ lookup('pipe', 'date -u +\"%Y-%m-%dT%H:%M:%SZ\"') }}"
  tags:
    - common
    - Always
