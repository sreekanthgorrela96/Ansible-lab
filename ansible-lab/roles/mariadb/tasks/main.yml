---
# tasks file for roles/mariadb

- name: Install MariaDB
  ansible.builtin.apt:
    name:
      - "{{ mariadb_package }}"
      - "{{ mariadb_python_package }}"
    state: present

- name: Start MariaDB
  ansible.builtin.service:
    name: "{{ mariadb_service }}"
    state: started
    enabled: true

- name: Create application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create application database user
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: localhost
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: sgorrela
    group: sgorrela
    mode: "0755"

- name: Create database backup
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: dump
    target: "{{ backup_dir }}/{{ backup_file }}"
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Verify backup file
  ansible.builtin.stat:
    path: "{{ backup_dir }}/{{ backup_file }}"
  register: backup_file_status

- name: Display backup status
  ansible.builtin.debug:
    msg: "MariaDB backup created at {{ backup_file_status.stat.path }}"
  when: backup_file_status.stat.exists
