---
# tasks file for roles/databse

- name: Install MySQL
  ansible.builtin.apt:
    name: mysql-server
    state: present

- name: Install Python MySQL dependency
  ansible.builtin.apt:
    name: python3-pymysql
    state: present

- name: Start MySQL
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true

- name: Create application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create database user
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: localhost
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
