---
# SPDX-License-Identifier: MIT-0

- name: Check whether the control plane is already initialized
  ansible.builtin.stat:
    path: "{{ k8s_admin_kubeconfig }}"
  register: k8s_admin_conf
  tags: [k8s, control_plane]

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    cmd: >-
      kubeadm init
      --pod-network-cidr={{ k8s_pod_network_cidr }}
      --service-cidr={{ k8s_service_cidr }}
      --cri-socket={{ k8s_cri_socket }}
      --upload-certs
      {{ ('--ignore-preflight-errors=' + k8s_kubeadm_ignore_preflight_errors) if (k8s_kubeadm_ignore_preflight_errors | default('') | length > 0) else '' }}
  register: k8s_kubeadm_init
  when: not k8s_admin_conf.stat.exists
  tags: [k8s, control_plane, init]

- name: Create kubeconfig directory for the deploying user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ 'root' if k8s_kubeconfig_user == 'root' else k8s_kubeconfig_user }}"
    group: "{{ 'root' if k8s_kubeconfig_user == 'root' else k8s_kubeconfig_user }}"
    mode: "0755"
  loop: "{{ ['/root/.kube'] + ([] if k8s_kubeconfig_user == 'root' else ['/home/' ~ k8s_kubeconfig_user ~ '/.kube']) }}"
  tags: [k8s, control_plane]

- name: Install admin kubeconfig for root
  ansible.builtin.copy:
    src: "{{ k8s_admin_kubeconfig }}"
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode or k8s_admin_conf.stat.exists
  tags: [k8s, control_plane]

- name: Install admin kubeconfig for the deploying user
  ansible.builtin.copy:
    src: "{{ k8s_admin_kubeconfig }}"
    dest: "/home/{{ k8s_kubeconfig_user }}/.kube/config"
    remote_src: true
    owner: "{{ k8s_kubeconfig_user }}"
    group: "{{ k8s_kubeconfig_user }}"
    mode: "0600"
  when:
    - k8s_kubeconfig_user != "root"
    - not ansible_check_mode or k8s_admin_conf.stat.exists
  tags: [k8s, control_plane]

- name: Wait until the Kubernetes API is ready
  ansible.builtin.command:
    cmd: kubectl --kubeconfig={{ k8s_admin_kubeconfig }} get --raw=/readyz
  register: k8s_api_ready
  retries: "{{ k8s_api_wait_retries }}"
  delay: "{{ k8s_api_wait_delay }}"
  until: k8s_api_ready.rc == 0
  changed_when: false
  when: not ansible_check_mode or k8s_admin_conf.stat.exists
  tags: [k8s, control_plane]

- name: Download Calico manifest
  ansible.builtin.get_url:
    url: "{{ k8s_cni_manifest_url }}"
    dest: "{{ k8s_cni_manifest_path }}"
    mode: "0644"
  tags: [k8s, control_plane, cni]

- name: Apply Calico CNI
  ansible.builtin.command:
    cmd: kubectl --kubeconfig={{ k8s_admin_kubeconfig }} apply -f {{ k8s_cni_manifest_path }}
  register: k8s_cni_apply
  changed_when: "'configured' in k8s_cni_apply.stdout or 'created' in k8s_cni_apply.stdout"
  when: not ansible_check_mode or k8s_admin_conf.stat.exists
  tags: [k8s, control_plane, cni]

- name: Wait until Calico pods are ready
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig={{ k8s_admin_kubeconfig }}
      wait --namespace=kube-system
      --for=condition=Ready pod
      --selector=k8s-app=calico-node
      --timeout=30s
  register: k8s_calico_wait
  retries: "{{ k8s_cni_wait_retries }}"
  delay: "{{ k8s_cni_wait_delay }}"
  until: k8s_calico_wait.rc == 0
  changed_when: false
  when: not ansible_check_mode or k8s_admin_conf.stat.exists
  tags: [k8s, control_plane, cni]

- name: Allow workloads on the control plane when requested
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig={{ k8s_admin_kubeconfig }}
      taint nodes {{ inventory_hostname }} node-role.kubernetes.io/control-plane:NoSchedule-
  when:
    - k8s_allow_control_plane_workloads | bool
    - not ansible_check_mode or k8s_admin_conf.stat.exists
  register: k8s_untaint
  changed_when: k8s_untaint.rc == 0
  failed_when: false
  tags: [k8s, control_plane]

- name: Create a fresh worker join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command --ttl {{ k8s_join_token_ttl }}
  register: k8s_join_cmd
  changed_when: true
  when: not ansible_check_mode or k8s_admin_conf.stat.exists
  tags: [k8s, control_plane, join]

- name: Publish join command for worker plays
  ansible.builtin.set_fact:
    k8s_join_command: "{{ k8s_join_cmd.stdout | trim }}"
  when: k8s_join_cmd is defined and k8s_join_cmd.stdout is defined
  tags: [k8s, control_plane, join]

- name: Fetch kubeconfig to the Ansible controller
  ansible.builtin.fetch:
    src: "{{ k8s_admin_kubeconfig }}"
    dest: "{{ k8s_fetch_kubeconfig_dest }}/{{ inventory_hostname }}.conf"
    flat: true
  when:
    - k8s_fetch_kubeconfig | bool
    - not ansible_check_mode or k8s_admin_conf.stat.exists
  tags: [k8s, control_plane]
