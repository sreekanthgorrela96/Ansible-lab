---
# SPDX-License-Identifier: MIT-0

- name: Assert Ubuntu 22.04 LTS
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version == "22"
    fail_msg: "This role targets Ubuntu 22.04 LTS. Detected {{ ansible_distribution }} {{ ansible_distribution_version }}."
    success_msg: "Host {{ inventory_hostname }} is Ubuntu {{ ansible_distribution_version }}."
  tags: [k8s, node, Always]

- name: Set hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: [k8s, node]

- name: Warn when control-plane sized resources are below kubeadm minimums
  ansible.builtin.debug:
    msg: >-
      kubeadm recommends at least 2 CPUs and 2 GiB RAM on the control plane.
      This host reports {{ ansible_processor_vcpus }} CPU(s) and
      {{ (ansible_memtotal_mb / 1024) | round(1) }} GiB RAM.
  when: ansible_processor_vcpus | int < 2 or ansible_memtotal_mb | int < 1700
  tags: [k8s, node]

- name: Disable swap for the current session
  ansible.builtin.command:
    cmd: swapoff -a
  changed_when: false
  tags: [k8s, node, swap]

- name: Comment swap entries in fstab so swap stays disabled
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\s+swap\s+.*)$'
    replace: '# \1'
  tags: [k8s, node, swap]

- name: Persist kernel modules required by Kubernetes
  ansible.builtin.template:
    src: k8s-modules.conf.j2
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
  tags: [k8s, node, kernel]

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k8s_kernel_modules }}"
  tags: [k8s, node, kernel]

- name: Persist Kubernetes sysctl settings
  ansible.builtin.template:
    src: k8s-sysctl.conf.j2
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
  register: k8s_sysctl_file
  tags: [k8s, node, kernel]

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  when: k8s_sysctl_file.changed
  changed_when: true
  tags: [k8s, node, kernel]

- name: Install prerequisite packages
  ansible.builtin.apt:
    name: "{{ k8s_prereq_packages }}"
    state: present
    update_cache: true
  tags: [k8s, node, packages]

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k8s, node, packages]

- name: Include containerd runtime tasks
  ansible.builtin.include_tasks: containerd.yml
  tags: [k8s, node, containerd]

- name: Include kubeadm package tasks
  ansible.builtin.include_tasks: packages.yml
  tags: [k8s, node, packages]

- name: Apply pending containerd restarts before kubeadm
  ansible.builtin.meta: flush_handlers
  tags: [k8s, node, containerd]

- name: Open Kubernetes ports when UFW is managed by this role
  ansible.builtin.include_tasks: ufw.yml
  when: k8s_configure_ufw | bool
  tags: [k8s, node, firewall]
