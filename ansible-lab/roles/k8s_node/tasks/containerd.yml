---
- name: Download Docker apt signing key (armored)
  ansible.builtin.get_url:
    url: "{{ k8s_docker_gpg_url }}"
    dest: /tmp/docker.gpg.asc
    mode: "0644"

- name: Dearmor Docker apt signing key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg.asc
    creates: /etc/apt/keyrings/docker.gpg

- name: Restrict Docker keyring permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Add Docker apt repository for containerd.io
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "{{ k8s_docker_apt_repo }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Install containerd
  ansible.builtin.apt:
    name: "{{ k8s_containerd_packages }}"
    state: present
    update_cache: true
  when: not ansible_check_mode

- name: Check whether Docker is already running on this host
  ansible.builtin.command:
    cmd: systemctl is-active docker
  register: k8s_docker_active
  changed_when: false
  failed_when: false

- name: Check whether containerd CRI is disabled (Docker-owned runtime)
  ansible.builtin.command:
    cmd: grep -E 'disabled_plugins.*cri' /etc/containerd/config.toml
  register: k8s_cri_disabled
  changed_when: false
  failed_when: false

- name: Use cri-dockerd when Docker already owns containerd
  ansible.builtin.set_fact:
    k8s_use_cri_dockerd: "{{ k8s_docker_active.rc == 0 and k8s_cri_disabled.rc == 0 }}"

- name: Set CRI socket for cri-dockerd
  ansible.builtin.set_fact:
    k8s_cri_socket: "{{ k8s_cri_dockerd_socket }}"
  when: k8s_use_cri_dockerd | bool

- name: Install cri-dockerd so kubeadm does not replace Docker's containerd
  ansible.builtin.include_tasks: cri_dockerd.yml
  when: k8s_use_cri_dockerd | bool

- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not (k8s_use_cri_dockerd | bool)

- name: Generate default containerd configuration
  ansible.builtin.command:
    cmd: containerd config default
  register: k8s_containerd_default
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - not (k8s_use_cri_dockerd | bool)

- name: Write containerd config with systemd cgroup and matching pause image
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
    content: >-
      {{
        k8s_containerd_default.stdout
        | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true')
        | regex_replace('sandbox_image = ".*"', 'sandbox_image = "' + k8s_pause_image + '"')
      }}
  notify: Restart containerd
  when:
    - not (k8s_use_cri_dockerd | bool)
    - k8s_containerd_default is defined
    - k8s_containerd_default.stdout is defined
    - k8s_containerd_default.stdout | length > 0

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true
  when:
    - not ansible_check_mode
    - not (k8s_use_cri_dockerd | bool)
