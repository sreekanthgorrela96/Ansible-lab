---
# SPDX-License-Identifier: MIT-0
# Shared node prep for kubeadm (Ubuntu 22.04 LTS).

k8s_minor_version: "1.33"
k8s_pause_image: "registry.k8s.io/pause:3.10"

k8s_docker_gpg_url: "https://download.docker.com/linux/ubuntu/gpg"
k8s_docker_apt_repo: "deb [arch={{ k8s_apt_arch }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

k8s_pkgs_gpg_url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/Release.key"
k8s_pkgs_apt_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/ /"

k8s_apt_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"

k8s_packages:
  - kubelet
  - kubeadm
  - kubectl

k8s_containerd_packages:
  - containerd.io

k8s_prereq_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - gnupg2
  - software-properties-common

k8s_kernel_modules:
  - overlay
  - br_netfilter

k8s_sysctl:
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  net.ipv4.ip_forward: "1"

k8s_configure_ufw: false
k8s_ufw_ports:
  - "6443/tcp"
  - "2379:2380/tcp"
  - "10250/tcp"
  - "10257/tcp"
  - "10259/tcp"
  - "30000:32767/tcp"
  - "179/tcp"
  - "4789/udp"
