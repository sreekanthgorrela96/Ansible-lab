---
# SPDX-License-Identifier: MIT-0
# Build a kubeadm Kubernetes cluster on Ubuntu 22.04 LTS.
#
# Inventory: ansible-lab/inventory/k8s/hosts
# Guide:     ansible-lab/K8S-CLUSTER-README.md

- name: Prepare all Kubernetes nodes
  hosts: k8s_cluster
  become: true
  gather_facts: true
  tags: [k8s, node]
  roles:
    - role: k8s_node
      tags: [k8s, node]

- name: Initialize the control plane and install Calico
  hosts: k8s_control_plane
  become: true
  gather_facts: true
  tags: [k8s, control_plane]
  roles:
    - role: k8s_control_plane
      tags: [k8s, control_plane]

- name: Join worker nodes
  hosts: k8s_workers
  become: true
  gather_facts: true
  tags: [k8s, worker]
  roles:
    - role: k8s_worker
      tags: [k8s, worker]

- name: Verify cluster health from the control plane
  hosts: k8s_control_plane
  become: true
  gather_facts: false
  tags: [k8s, verify]
  tasks:
    - name: List nodes
      ansible.builtin.command:
        cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes -o wide
      register: k8s_nodes
      changed_when: false

    - name: List kube-system pods
      ansible.builtin.command:
        cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -A -o wide
      register: k8s_pods
      changed_when: false

    - name: Show cluster status
      ansible.builtin.debug:
        msg:
          - "{{ k8s_nodes.stdout_lines }}"
          - "{{ k8s_pods.stdout_lines }}"
