# Ansible Configuration for AWS Dynamic Inventory with SSM Connection
# This configuration optimizes for performance, security, and dynamic inventory

[defaults]
# Path Configuration
roles_path = ansible-lab/roles
inventory = ansible-lab/inventory/aws_ec2.yaml
inventory_plugins = /usr/share/ansible/plugins/inventory
remote_tmp = /tmp/.ansible/tmp

# Python Configuration
interpreter_python = auto_silent

# Connection Settings
timeout = 300
connect_timeout = 60
remote_user = ec2-user  # Or 'ubuntu' depending on AMI

# SSH Disabled - Using SSM Connection Plugin
host_key_checking = False
ssh_common_args = ~

# Dynamic Inventory & Plugin Configuration
enable_plugins = amazon.aws.aws_ec2
# allow_unsafe_lookups = false

# Logging and Output
log_path = logs/ansible.log
verbosity = 1
# Display
display_skipped_hosts = False
display_ok_hosts = True

# Performance Optimization
fact_caching = jsonfile
fact_caching_connection = .ansible/cache
fact_caching_timeout = 86400  # 24 hours
# Limit facts caching to specific facts only
# fact_caching_implicit_admin = True

# Gathering Facts
gather_subset = !hardware,!lvm,!facter,!ohai
gather_timeout = 20

# Async Configuration
poll_interval = 15
internal_poll_interval = 0.001

# Privilege Escalation
become = False
become_method = sudo
become_user = root
become_ask_pass = False

# Error Handling
force_handlers = True
force_color = True
# nocows = True

# Jinja2 Configuration
jinja2_native = False
force_valid_group_chars = warning

# Retry Files
retry_files_enabled = True
retry_files_save_path = ./retry_files/

# Diff Display
diff_always = False
diff_context = 3

# Collections Configuration
collections_paths = collections
collections_on_ansible_version_mismatch = error

[inventory]
# Inventory Plugin Configuration
enable_plugins = amazon.aws.aws_ec2, yaml, ini, aws_ec2

[privilege_escalation]
# Privilege Escalation for Ansible
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection plugin settings
# NOTE: Not used with SSM, but kept for fallback scenarios
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
pipelining = True
transfer_method = smart

[paramiko_connection]
# Paramiko (Python SSH) settings if needed for fallback
host_key_auto_add = True

[aws_ec2]
# AWS EC2 Inventory Plugin Configuration
# Enable caching for dynamic inventory
cache = True
cache_plugin = jsonfile
cache_dir = .ansible/cache
cache_prefix = aws_ec2
cache_timeout = 3600  # 1 hour - adjust based on your environment change frequency

# This section provides defaults for aws_ec2.yaml inventory file
# Can be overridden in aws_ec2.yaml itself
